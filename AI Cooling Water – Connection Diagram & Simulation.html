<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32 AI Cooling Water – Virtual Simulation</title>
<style>
:root{--bg:#eef1f4;--fg:#1d2733;--card:#fff;--bd:#c9d2db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--fg:#e6ebf0;--card:#1e252c;--bd:#37424d}}
:root[data-theme="dark"]{--bg:#14181d;--fg:#e6ebf0;--card:#1e252c;--bd:#37424d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
h1{font-size:17px;margin:4px 0 8px}
.sheet{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:#f7f9fb}
svg{display:block;min-width:900px;width:100%;height:auto;font-family:system-ui,Arial,sans-serif}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
.card label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:2px}
input[type=range]{width:100%}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;margin:2px;cursor:pointer;font:inherit}
button.on{background:#2f8fbf;color:#fff;border-color:#2f8fbf}
#res{font-size:15px;font-weight:700}
.flow{stroke-dasharray:10 8;animation:f .7s linear infinite}
@keyframes f{to{stroke-dashoffset:-18}}
.spin{animation:r .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes r{to{transform:rotate(360deg)}}
small{opacity:.75}
</style></head><body><div class="wrap">
<h1>AI-Predicted Cooling Water Life Extension — connection diagram &amp; live simulation</h1>
<div class="sheet"><svg id="s" viewBox="0 0 1100 810"></svg></div>
<div class="ctl">
<div class="card"><label>TDS <span id="vt"></span></label><input id="t" type="range" min="50" max="2200" value="350">
<label>Turbidity <span id="vb"></span></label><input id="b" type="range" min="0" max="100" value="6">
<label>Water temp <span id="vp"></span></label><input id="p" type="range" min="15" max="60" value="32"></div>
<div class="card"><div id="res"></div><div id="det"></div><small>Rule: life ≥ 24 h keep · 6–24 h filter + recheck · &lt; 6 h secondary/drain. Baseline = fixed cut-off (TDS &gt; 1200 or turbidity &gt; 40).</small></div>
<div class="card"><b>Scenarios</b><br><button data-p="350,6,32">Fresh</button><button data-p="900,18,38">Aging</button><button data-p="1500,40,45">Dirty</button><button data-p="2100,80,55">Unsafe</button><br>
<button id="auto">▶ Auto-degrade cycle</button><button id="rs">Reset litres</button></div>
</div></div>
<script>
const S=document.getElementById('s'),NS='http://www.w3.org/2000/svg';
function E(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
function T(x,y,s,o){o=o||{};const e=E('text',{x,y,'font-size':o.z||11,'text-anchor':o.a||'middle',fill:o.c||'#1d2733'});if(o.b)e.setAttribute('font-weight','700');e.textContent=s;return e}
function B(x,y,w,h,l,c,sub){const r=E('rect',{x,y,width:w,height:h,rx:6,fill:c,stroke:'#33414f','stroke-width':1.5});T(x+w/2,y+h/2+(sub?-2:4),l,{z:11.5,b:1});if(sub)T(x+w/2,y+h/2+11,sub,{z:9});return r}
function W(pts,col,w,dash){return E('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:col,'stroke-width':w||2,'stroke-linejoin':'round',...(dash?{'stroke-dasharray':dash}:{})})}
function dot(x,y,c){E('circle',{cx:x,cy:y,r:3.5,fill:c||'#222'})}
const C={an:'#2b7fd0',i2:'#8a4fc7',sg:'#9a9a9a',v12:'#d12a2a',v5:'#ef7b00',v3:'#0a9d8f'};
E('rect',{width:1100,height:810,fill:'#f7f9fb'});
T(20,14,'ESP32 AI COOLING WATER SYSTEM — VIRTUAL PROTOTYPE (tabletop retrofit unit)',{a:'start',z:12.5,b:1});

/* ---------- water loop pipes (behind) ---------- */
const pipes={};
function P(id,d){E('path',{d,fill:'none',stroke:'#cfe3ee','stroke-width':12,'stroke-linecap':'round','stroke-linejoin':'round'});pipes[id]=E('path',{d,fill:'none',stroke:'#2f8fbf','stroke-width':4,'stroke-linejoin':'round',opacity:0})}
P('main','M170,640 L460,640');P('p2','M520,640 L570,640');
P('keep','M570,640 L570,545 L120,545 L120,560');
P('filt','M570,640 L880,640 L880,520 L100,520 L100,560');
P('drain','M570,640 L570,715 L900,715');
T(70,500,'WATER LOOP (transparent 8×6 mm silicone tubing)',{a:'start',z:11,b:1});
T(350,538,'① KEEP CIRCULATING (return to reservoir)',{c:'#1b7a36',z:11,b:1});
T(500,512,'② FILTER + RECHECK (sediment + carbon, back to reservoir)',{c:'#1a6fa8',z:11,b:1});
T(840,707,'③ SECONDARY / DRAIN',{c:'#7b3fa0',z:11,b:1});
E('rect',{x:185,y:612,width:265,height:58,rx:6,fill:'none',stroke:'#2f8fbf','stroke-dasharray':'5 4'});
T(317,666,'SENSOR CHAMBER (probes in flow)',{z:9});

/* ---------- electronics ---------- */
T(445,32,'3V3',{z:9});
const esp=B(430,40,260,200,'','#e3e6ea');T(560,128,'ESP32 DevKit V1',{z:14,b:1});T(560,146,'ESP-WROOM-32',{z:10});T(560,162,'AI model: remaining-life prediction',{z:9});
[[90,'GPIO34 · TDS'],[125,'GPIO35 · TURB'],[160,'GPIO32 · NTC'],[195,'GPIO21 · SDA'],[215,'GPIO22 · SCL']].forEach(([y,l])=>{dot(430,y);T(438,y+4,l,{a:'start',z:10})});
[[90,'GPIO26 · PUMP'],[150,'GPIO27 · FILTER'],[210,'GPIO25 · DRAIN']].forEach(([y,l])=>{dot(690,y);T(682,y+4,l,{a:'end',z:10})});
[[480,'19'],[540,'18'],[600,'4']].forEach(([x,l])=>{dot(x,240);T(x,232,'GPIO'+l,{z:9.5})});
dot(690,235);T(682,238,'VIN',{a:'end',z:9});

/* sensor modules */
B(60,74,170,32,'TDS MODULE','#d6e8f8','analog out · 3.3V');
B(60,109,170,32,'TURBIDITY MODULE','#d6e8f8','analog out · 3.3V');
B(60,144,170,32,'NTC 10K + 10K DIVIDER','#d6e8f8','waterproof probe');
B(60,181,170,50,'0.96" OLED SSD1306','#d6e8f8','128×64 · I2C · front panel');
const OL=E('rect',{x:60,y:240,width:170,height:90,rx:4,fill:'#05110a',stroke:'#33414f'});
const ol=[0,1,2,3,4,5].map(i=>T(68,255+i*13.5,'',{a:'start',z:10,c:'#7dff9a'}));
/* signal wires into ESP32 */
W([[230,90],[430,90]],C.an,2.2);W([[230,125],[430,125]],C.an,2.2);W([[230,160],[430,160]],C.an,2.2);
W([[230,195],[430,195]],C.i2,2.2);W([[230,215],[430,215]],C.i2,2.2);
T(330,85,'analog',{z:9,c:C.an});T(330,190,'SDA',{z:9,c:C.i2});T(330,210,'SCL',{z:9,c:C.i2});
/* probe cables to water */
W([[60,90],[22,90],[22,480],[225,480],[225,634]],C.an,2,'6 3');
W([[60,125],[36,125],[36,470],[315,470],[315,634]],C.an,2,'6 3');
W([[60,160],[50,160],[50,460],[405,460],[405,634]],C.an,2,'6 3');
[[225,'TDS'],[315,'TURB'],[405,'NTC']].forEach(([x,l])=>{E('circle',{cx:x,cy:640,r:7,fill:'#f2c14e',stroke:'#33414f'});T(x,683,l+' probe',{z:9.5,b:1})});
/* 3V3 rail */
W([[450,40],[450,30],[250,30],[250,198]],C.v3,2);
[82,117,152,188].forEach(y=>W([[250,y],[230,y]],C.v3,1.6));

/* relays */
const rl=[0,1,2].map(i=>B(800,66+i*60,130,48,'RELAY '+(i+1)+' · '+['PUMP','FILTER VALVE','DRAIN VALVE'][i],'#ddd','5V module'));
const sg=[90,150,210].map(y=>W([[690,y],[800,y]],C.sg,2.5));
const ac=[
 W([[930,100],[1030,100],[1030,770],[490,770],[490,670]],'#b9b9b9',3),
 W([[930,160],[1050,160],[1050,780],[655,780],[655,660]],'#b9b9b9',3),
 W([[930,220],[1070,220],[1070,790],[730,790],[730,735]],'#b9b9b9',3)];
T(1040,765,'NO→12V load',{z:9,a:'end'});
/* 12 V bus and COM stubs */
W([[1020,330],[1090,330],[1090,80]],C.v12,2.6);[80,140,200].forEach(y=>{W([[1090,y],[930,y]],C.v12,1.8);T(940,y-3,'COM',{z:8.5,a:'start',c:C.v12})});
/* power */
B(960,255,120,30,'12V DC ADAPTER','#f6d4d4');B(990,293,60,22,'FUSE','#f6d4d4');
W([[1020,285],[1020,293]],C.v12,2.6);W([[1020,315],[1020,345]],C.v12,2.6);dot(1020,330,C.v12);
B(960,345,120,44,'LM2596 BUCK','#f8e0c4','12V → 5V');T(1020,252,'POWER',{z:10,b:1});
W([[960,367],[790,367],[790,76]],C.v5,2.4);[76,136,196].forEach(y=>W([[790,y],[800,y]],C.v5,1.8));
W([[790,235],[690,235]],C.v5,2.4);T(760,229,'5V',{z:9,c:C.v5});
T(860,375,'5V rail → relays + ESP32 VIN',{z:9.5,c:C.v5});
T(1060,248,'12V bus',{z:9.5,c:C.v12,a:'end'});

/* LEDs */
E('rect',{x:455,y:262,width:170,height:98,rx:6,fill:'none',stroke:'#33414f','stroke-dasharray':'5 4'});
T(540,274,'FRONT-PANEL LEDs',{z:9.5,b:1});
const lc=['#2ecc40','#ffcc00','#ff3b30'],led=[];
[[480,'KEEP'],[540,'FILTER'],[600,'SECONDARY']].forEach(([x,l],i)=>{W([[x,240],[x,284]],C.sg,1.8);E('rect',{x:x-12,y:284,width:24,height:11,fill:'#e8d9b0',stroke:'#333'});T(x,293,'220Ω',{z:7});
 W([[x,295],[x,305]],'#444',1.8);led[i]=E('circle',{cx:x,cy:315,r:9,fill:'#555',stroke:'#222'});W([[x,324],[x,340],[480,340]],'#222',1.6);T(x,353,l,{z:9.5,b:1})});
T(560,339,'GND',{z:8});
/* legend */
E('rect',{x:70,y:345,width:340,height:100,rx:6,fill:'#fff',stroke:'#c9d2db'});
[['12V actuator / bus',C.v12],['5V relay rail',C.v5],['3.3V logic / sensors',C.v3],['Analog sensor signal',C.an],['I2C (SDA/SCL)',C.i2],['GPIO relay/LED drive',C.sg]].forEach(([l,c],i)=>{W([[80+(i%2)*165,362+Math.floor(i/2)*20],[110+(i%2)*165,362+Math.floor(i/2)*20]],c,3);T(116+(i%2)*165,366+Math.floor(i/2)*20,l,{a:'start',z:9.5})});
T(240,435,'All grounds common (GND bus terminal). Electronics isolated from water path.',{z:9});

/* ---------- water components ---------- */
B(70,560,100,120,'RESERVOIR','#e6f3fa','transparent tank');
const pump=B(460,610,60,60,'PUMP','#cfd3d8','12V DC');
const fan=E('g',{});E('line',{x1:480,y1:640,x2:500,y2:640,stroke:'#333','stroke-width':3},fan);E('line',{x1:490,y1:630,x2:490,y2:650,stroke:'#333','stroke-width':3},fan);
E('circle',{cx:570,cy:640,r:6,fill:'#2f8fbf'});T(570,662,'TEE',{z:9});
const vf=B(630,620,50,40,'VALVE F','#ccc','12V sol.');
const flt=B(720,615,110,50,'FILTER','#ece4cf','sediment + carbon');
const vd=B(700,695,60,40,'VALVE D','#ccc','12V sol.');
B(900,670,100,70,'SECONDARY','#e8dcf3','cleaning / plants');
T(420,760,'12V actuator wiring runs in a separate low channel',{z:9,c:C.v12});

/* ---------- simulation ---------- */
const st={t:350,b:6,p:32,saved:0,auto:false,dc:0};
const $=id=>document.getElementById(id);
function life(){const sc=.5*Math.min(st.t/1800,1.3)+.35*Math.min(st.b/60,1.3)+.15*Math.max(0,(st.p-30)/25);return Math.max(0,Math.round(96*(1-sc)))}
function upd(){
 const L=life(),m=L>=24?0:L>=6?1:2,base=(st.t>1200||st.b>40),R=[1,m==1,m==2];
 if(base&&m<2)st.saved+=0.02;
 const names=['KEEP CIRCULATING','FILTER + RECHECK','SECONDARY / DRAIN'];
 ['t','b','p'].forEach(k=>$(k).value=st[k]);
 $('vt').textContent=Math.round(st.t)+' ppm';$('vb').textContent=Math.round(st.b)+' NTU';$('vp').textContent=Math.round(st.p)+' °C';
 $('res').textContent='Predicted life: '+L+' h → '+names[m];
 $('det').innerHTML='Fixed-threshold baseline: <b>'+(base?'would DRAIN':'keep')+'</b><br>Fresh water saved: <b>'+st.saved.toFixed(1)+' L</b>';
 [ 'TDS '+Math.round(st.t)+' ppm','Turb '+Math.round(st.b)+' NTU','Temp '+Math.round(st.p)+' C','Life '+L+' h','Route: '+['KEEP','FILTER','SECONDARY'][m],'Saved '+st.saved.toFixed(1)+' L'].forEach((s,i)=>ol[i].textContent=s);
 const cols=['#7dff9a','#ffe27d','#ff8a80'];ol.forEach(o=>o.setAttribute('fill',cols[m]));
 rl.forEach((r,i)=>r.setAttribute('fill',R[i]?'#ffe9a8':'#ddd'));
 sg.forEach((w,i)=>w.setAttribute('stroke',R[i]?'#e0a800':'#9a9a9a'));
 ac.forEach((w,i)=>w.setAttribute('stroke',R[i]?'#d12a2a':'#b9b9b9'));
 led.forEach((l,i)=>l.setAttribute('fill',i==m?lc[i]:'#555'));
 vf.setAttribute('fill',R[1]?'#9fe0a8':'#ccc');vd.setAttribute('fill',R[2]?'#9fe0a8':'#ccc');
 flt.setAttribute('fill',m==1?'#f3dc9a':'#ece4cf');
 fan.setAttribute('class','spin');
 const on={main:1,p2:1,keep:m==0,filt:m==1,drain:m==2};
 for(const k in pipes){pipes[k].setAttribute('opacity',on[k]?1:0);pipes[k].setAttribute('class',on[k]?'flow':'')}
 if(st.auto){st.t+=3.2;st.b+=.12;st.p+=.025;if(m==2){if(++st.dc>25){st.t=350;st.b=6;st.p=32;st.dc=0}}}
}
['t','b','p'].forEach(k=>$(k).oninput=e=>{st[k]=+e.target.value});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{[st.t,st.b,st.p]=b.dataset.p.split(',').map(Number)});
$('auto').onclick=()=>{st.auto=!st.auto;$('auto').classList.toggle('on',st.auto);$('auto').textContent=st.auto?'⏸ Auto-degrade running':'▶ Auto-degrade cycle'};
$('rs').onclick=()=>{st.saved=0};
setInterval(upd,100);upd();
</script></body></html>
